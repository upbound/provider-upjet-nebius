                          "parent_id": "project-id"
                        },
                        "type": "NETWORK_SSD"
                      }
                    }
                  },
                  "name": "example-vm",
                  "network_interfaces": [
                    {
                      "ip_address": {
                        "allocation_id": "private-allocation-id"
                      },
                      "name": "eth0",
                      "subnet_id": "subnet-id"
                    }
                  ],
                  "parent_id": "project-id",
                  "resources": {
                    "platform": "cpu-e2",
                    "preset": "2vcpu-8gb"
                  }
                }
        argumentDocs:
            <hostname>.<network_id>.compute.internal.: or <instance_id>.<network_id>.compute.internal. if hostname is not specified.
            AUTO: ':'
            DISK_ENCRYPTION_MANAGED: |-
                :
                Enables encryption using the platform's default root key from KMS.
                Available for disks with NETWORK_SSD_NON_REPLICATED and NETWORK_SSD_IO_M3 types only.
            DISK_ENCRYPTION_UNSPECIFIED: '- No encryption is applied unless explicitly specified.'
            Disk.spec.deletion_protection: is enabled.
            FORBID: |-
                :
                The instance is launched only using on-demand (PAYG) capacity.
                No attempt is made to find or use a Capacity Block.
                It's an error to provide reservation_ids with policy = FORBID
            ManagedDisk.name: |-
                MUST match the current disk name
                (see DiskService.Get for the disk referenced by ExistingDisk.id).
            STRICT: ':'
