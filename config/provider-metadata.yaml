    nebius_dns_v1_record Resource - nebius:
        subCategory: ""
        description: 'API Resource: DNS Resource Record (RR), an information entry about a specific domain Each record is contained within a DNS zone, which is a container for DNS data of a specific domain, and, possibly, its subdomains DNS zones are represented in this API by the Zone API Resource which is managed by the ZoneService'
        name: nebius_dns_v1_record Resource - nebius
        title: nebius_dns_v1_record Resource - nebius
        argumentDocs:
            10 xyz.tuv: for a @ 600 IN MX 10 xyz.tuv. resource record in a zonefile
            A: '- A record: IPv4 address'
            AAAA: '- AAAA record: IPv6 address'
            CAA: '- CAA record: certificate issuance settings for this DNS zone and its subzones'
            CNAME: '- CNAME record: an alias for a canonical domain name'
            HTTPS: |-
                :
                HTTPS record: service binding with HTTPS protocol configuration.
                See RFC 9460, section 9.1
            MX: '- MX record: mail server information (domain name, priority)'
            NS: '- NS record: domain name of an authoritative nameserver for this DNS zone, or one of its subzones'
            PTR: '- PTR record: mapping from IP address to a domain name'
            RECORD_TYPE_UNSPECIFIED: '- Record type is not specified'
            RecordService/Delete: API with force flag set to true
            SOA: '- SOA record: administrative information about this DNS zone'
            SRV: '- SRV record: information about a network service (domain name, port, weight)'
            SVCB: '- SVCB record: service binding. See RFC 9460, section 2.3'
            TXT: '- TXT record: text data, typically used to verify e-mail addresses, websites and TLS certificates'
            YYYY-MM-DDTHH:MM:SSZ: or YYYY-MM-DDTHH:MM:SS.SSS±HH:MM
            created_at: '(String) :'
            data: '(String) :'
            deletion_protection: '(Boolean) :'
            effective_fqdn: (String) Fully-qualified domain name of this record including . at the end, e.g. www.example.com.
            id: (String) Identifier for the resource, unique for its resource type.
            labels: (Map of String) Labels associated with the resource.
            metadata: '(Attributes) :'
            metadata.parent_id: must be a DNS zone ID
            name: (String) Human readable name for the resource.
            parent_id: (String) Identifier of the parent resource to which the resource belongs.
            reconciling: (Boolean) Indicates whether there is a running Operation for this Record
            relative_name: '(String) :'
            resource_version: '(Number) :'
            status: '(Attributes) :'
            ttl: (Number) Record TTL. If absent or negative, will be assumed to be the default value (600)
            type: '(String) :'
            updated_at: '(String) :'
            www: |-
                for www.<parent zone's domain name>)
                Use @ for records in zone apex (that is, records that have the same domain name as the zone itself)
                To see the resolved absolute domain name, see Record.status.effective_fqdn
            zone_domain_name: (String) Domain name of this record's parent zone including . at the end, e.g. example.com.
        importStatements: []
    nebius_dns_v1_zone Resource - nebius:
        subCategory: ""
        description: 'API Resource: DNS zone, a container for DNS data Each DNS zone starts at a particular domain within the hierarchical DNS namespace tree, e.g., example.com., and can also include its subdomains, e.g., sales.example.com. DNS Zones contain Resource Records (RRs), which are individual information entries about the domain(s), e.g., a domain''s IP address See the graphical explanation of DNS zones and Resource Records on Wikipedia https://en.wikipedia.org/wiki/Domain_Name_System#/media/File:Domain_name_space.svg A Resource Record is represented in this API by the Record API Resource which is managed by the RecordService'
        name: nebius_dns_v1_zone Resource - nebius
        title: nebius_dns_v1_zone Resource - nebius
        argumentDocs:
            .: |-
                at the end
                Cannot be changed after creating the zone
            NXDOMAIN: |-
                ("record not found") DNS responses from this zone (negative caching)
                Set this TTL to a low value if you frequently delete and recreate records instead of updating them
                Note: Values of less than 5 will be ignored, and a default negative caching TTL will be used instead
