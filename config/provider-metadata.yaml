        title: nebius_compute_v1_instance Resource - nebius
        examples:
            - name: vm
              manifest: |-
                {
                  "boot_disk": {
                    "attach_mode": "READ_WRITE",
                    "managed_disk": {
                      "name": "example-vm-boot",
                      "spec": {
                        "size_gibibytes": 64,
                        "source_image_family": {
