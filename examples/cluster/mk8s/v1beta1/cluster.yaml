apiVersion: mk8s.nebius.upbound.io/v1beta1
kind: Cluster
metadata:
  annotations:
    meta.upbound.io/example-id: mk8s/v1beta1/cluster
  labels:
    testing.upbound.io/example-name: mk8s-v1beta1-cluster
  name: mk8sv1cluster
spec:
  forProvider:
    controlPlane:
      endpoints:
        publicEndpoint: {}
      etcdClusterSize: 1
      subnetIdSelector:
        matchLabels:
          testing.upbound.io/example-name: mk8s-v1beta1-cluster
      version: "1.36"
    name: mk8sv1cluster
    parentId: ${data.nebius_project_id}

---

apiVersion: vpc.nebius.upbound.io/v1beta1
kind: Subnet
metadata:
  annotations:
    meta.upbound.io/example-id: mk8s/v1beta1/cluster
  labels:
    testing.upbound.io/example-name: mk8s-v1beta1-cluster
  name: mk8sv1cluster
spec:
  forProvider:
    ipv4PrivatePools:
      useNetworkPools: true
    name: mk8sv1cluster
    networkIdSelector:
      matchLabels:
        testing.upbound.io/example-name: mk8s-v1beta1-cluster
    parentId: ${data.nebius_project_id}

---

apiVersion: vpc.nebius.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: mk8s/v1beta1/cluster
  labels:
    testing.upbound.io/example-name: mk8s-v1beta1-cluster
  name: mk8sv1cluster
spec:
  forProvider:
    name: mk8sv1cluster
    parentId: ${data.nebius_project_id}
