apiVersion: iam.nebius.upbound.io/v1beta1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: iam/v1beta1/group
  labels:
    testing.upbound.io/example-name: iam-v1beta1-group
  name: iamv1group
spec:
  forProvider:
    name: iamv1group
    # IAM groups are tenant scoped, so parentId is the tenant id.
    parentId: ${data.nebius_tenant_id}
