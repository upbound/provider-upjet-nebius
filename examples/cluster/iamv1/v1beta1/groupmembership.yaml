apiVersion: iamv1.nebius.upbound.io/v1beta1
kind: GroupMembership
metadata:
  annotations:
    meta.upbound.io/example-id: iamv1/v1beta1/groupmembership
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    parentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    memberIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default

---

apiVersion: iamv1.nebius.upbound.io/v1beta1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: iamv1/v1beta1/groupmembership
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    name: iamv1groupmembership
    parentId: ${data.nebius_tenant_id}

---

apiVersion: iamv1.nebius.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  annotations:
    meta.upbound.io/example-id: iamv1/v1beta1/groupmembership
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    name: iamv1groupmembership
    parentId: ${data.nebius_project_id}
