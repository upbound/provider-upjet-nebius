apiVersion: dnsv1.nebius.m.upbound.io/v1beta1
kind: Zone
metadata:
  annotations:
    meta.upbound.io/example-id: dnsv1/v1beta1/zone
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    domainName: dnsv1zone.uptest.
    name: dnsv1zone
    parentId: ${data.nebius_project_id}
    vpc:
      primaryNetworkIdSelector:
        matchLabels:
          testing.upbound.io/example-name: default

---

apiVersion: vpcv1.nebius.m.upbound.io/v1beta1
kind: Network
metadata:
  annotations:
    meta.upbound.io/example-id: dnsv1/v1beta1/zone
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    name: dnsv1zone
    parentId: ${data.nebius_project_id}
