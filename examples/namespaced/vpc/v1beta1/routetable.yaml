    meta.upbound.io/example-id: vpc/v1beta1/routetable
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    name: vpcv1routetable
    parentId: ${data.nebius_project_id}
