apiVersion: iamv1.nebius.m.upbound.io/v1beta1
kind: FederationCertificate
metadata:
  annotations:
    meta.upbound.io/example-id: iamv1/v1beta1/federationcertificate
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    name: iamv1federationcertificate
    # parent_id of a federation certificate represents the Federation it belongs to.
    parentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: default
    # data is a PEM-encoded X.509 certificate (sensitive), supplied via a Secret.
    dataSecretRef:
      name: iamv1federationcertificate-data
      namespace: upbound-system
      key: certificate

---

apiVersion: iamv1.nebius.m.upbound.io/v1beta1
kind: Federation
metadata:
  annotations:
    meta.upbound.io/example-id: iamv1/v1beta1/federationcertificate
    upjet.upbound.io/manual-intervention: "The Federation needs to state transition from ACTIVE to INACTIVE which does not work in 0.6.16 version of the provider (status.state is always ACTIVE)"
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: upbound-system
spec:
  forProvider:
    name: iamv1federationcertificate
    active: false
    parentId: ${data.nebius_tenant_id}
    samlSettings:
      idpIssuer: https://idp.example.com/saml/metadata
      ssoUrl: https://idp.example.com/saml/sso

---

apiVersion: v1
kind: Secret
metadata:
  name: iamv1federationcertificate-data
  namespace: upbound-system
type: Opaque
