          data from other providers or across different regions of Nebius Object Storage.
          Transfer consists of consecutive iterations where the service lists objects
          in the source bucket and moves those that need to be transferred according
          to the specified overwrite strategy and touch unmanaged flag value. After
          an iteration completes, the transfer will stop if its stop condition is
          met. Otherwise, it will wait for the defined inter-iteration interval before
          starting the next iteration.
