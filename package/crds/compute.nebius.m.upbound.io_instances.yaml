                      onPreemption:
                        description: |-
                          (String) :
                          :

                          Specifies what happens when the VM is preempted. The only supported value is STOP:
                          Compute stops the VM without deleting or restarting it.

                          #### Supported values

                          Possible values:

                          - `UNSPECIFIED`
                          - `STOP`
