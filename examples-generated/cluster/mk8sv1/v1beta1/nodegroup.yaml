apiVersion: mk8sv1.nebius.upbound.io/v1beta1
kind: NodeGroup
metadata:
  annotations:
    meta.upbound.io/example-id: mk8sv1/v1beta1/nodegroup
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    fixedNodeCount: 2
    name: default
    parentIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    template:
      bootDisk:
        sizeGibibytes: 64
        type: NETWORK_SSD
      networkInterfaces:
      - subnetIdSelector:
          matchLabels:
            testing.upbound.io/example-name: example
      resources:
        platform: cpu-e2
        preset: 2vcpu-8gb
    version: "1.31"
